<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#1976d2" />
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="IP 网络工具" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>IP 查询与网络诊断</title>
  <meta name="description" content="IP 查询、网站分流、WebRTC 检测、全球 Ping、服务状态和 WHOIS 查询工具。" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    // Classic ES5 script: IE cannot execute the application's module bundle.
    (function () {
      var root = document.documentElement;
      if (document.documentMode || /MSIE|Trident/.test(navigator.userAgent)) {
        root.className = "unsupported-browser";
        return;
      }
      try {
        var theme = localStorage.getItem("theme") || "system";
        var dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        ["color", "radius", "layout", "font-size"].forEach(function (key) {
          var value = localStorage.getItem("ui-" + key);
          if (value && value !== "default") root.setAttribute("data-" + key, value);
        });
      } catch (error) {
        // Keep the page usable when browser storage is unavailable.
      }
    })();
  </script>
  <script>
    // Embedded in iframe: full-width layout & zero-scrollbar auto-resizing
    (function () {
      if (window.self === window.top) return;

      var root = document.documentElement;
      root.setAttribute('data-layout', 'full');

      // Full-width layout & disable inner vertical scrollbars when embedded
      var style = document.createElement('style');
      style.textContent = [
        'html, body { overflow-y: hidden !important; height: auto !important; min-height: 100% !important; background-color: transparent !important; }',
        '.app-container { max-width: 100% !important; width: 100% !important; padding: 20px 24px !important; }'
      ].join('\n');
      document.head.appendChild(style);

      function postHeight() {
        var target = document.getElementById('root') || document.body;
        var height = Math.max(
          document.documentElement.scrollHeight,
          document.body.scrollHeight,
          target ? target.scrollHeight : 0,
          document.documentElement.offsetHeight,
          document.body.offsetHeight
        );
        if (height > 0) {
          window.parent.postMessage({ type: 'one-ip-resize', height: height }, '*');
        }
      }

      window.addEventListener('load', function() {
        postHeight();
        setTimeout(postHeight, 300);
        setTimeout(postHeight, 800);
        setTimeout(postHeight, 2000);
      });

      if (typeof ResizeObserver !== 'undefined') {
        var observer = new ResizeObserver(function () {
          postHeight();
        });
        window.addEventListener('DOMContentLoaded', function () {
          var target = document.getElementById('root') || document.body;
          if (target) observer.observe(target);
        });
      }

      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'request-height') {
          postHeight();
        }
      });
    })();
  </script>
  <style>
    html {
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }

    #unsupported-browser {
      display: none;
    }

    .unsupported-browser #root {
      display: none;
    }

    .unsupported-browser #unsupported-browser {
      display: block;
      max-width: 640px;
      margin: 80px auto;
      padding: 24px;
      font-family: sans-serif;
      line-height: 1.8;
      color: #171717;
      background: #fff;
    }
  </style>
</head>

<body>
  <div id="unsupported-browser" role="alert">
    <h1>不支持 Internet Explorer</h1>
    <p>请使用最新版 Microsoft Edge、Google Chrome、Firefox 或 Safari 访问本站。</p>
    <a href="https://www.microsoft.com/edge">下载 Microsoft Edge</a>
  </div>
  <noscript>请启用 JavaScript，并使用现代浏览器访问本站。</noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
